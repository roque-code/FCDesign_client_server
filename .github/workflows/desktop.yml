name: desktop

on:
  workflow_dispatch:

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            triple: x86_64-pc-windows-msvc
          - label: Windows ARM
            runner: windows-11-arm
            triple: aarch64-pc-windows-msvc
          - label: Mac M
            runner: macos-latest
            triple: aarch64-apple-darwin
          - label: Mac Intel
            runner: macos-15-intel
            triple: x86_64-apple-darwin
          - label: Linux x64
            runner: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
          - label: Linux ARM
            runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Librerías de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config fakeroot libfuse2
      - name: Firma, si hay certificados
        shell: bash
        run: sh desktop/scripts/sign.sh
      - name: PyInstaller con el CPython del corredor
        env:
          TRAZA_TARGET_TRIPLE: ${{ matrix.triple }}
        run: |
          python -m pip install pyinstaller
          python desktop/scripts/freeze_host.py
      - name: Interfaz
        working-directory: frontend
        run: npm ci
      - name: CLI de Tauri
        working-directory: desktop
        run: npm ci
      - name: Icono
        working-directory: desktop
        run: npx tauri icon icons/icon.png
      - name: Paquete
        working-directory: desktop
        shell: bash
        env:
          TRAZA_TARGET_TRIPLE: ${{ matrix.triple }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          for name in APPLE_SIGNING_IDENTITY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            eval "value=\${$name-}"
            if [ -z "$value" ]; then
              unset "$name"
            fi
          done
          report() {
            title="$1"
            level="$2"
            file="$3"
            tail -n 40 "$file"
            tail -n 25 "$file" | while IFS= read -r line; do
              line=${line//::/.}
              echo "::$level title=$title::$line"
            done
          }
          if [ "$(uname -s)" = "Linux" ]; then
            set +e
            npx tauri build --config '{"bundle":{"externalBin":["binaries/traza-host"],"targets":["deb"]}}' >"$RUNNER_TEMP/deb.log" 2>&1
            code=$?
            set -e
            if [ "$code" -ne 0 ]; then
              report "Paquete deb" error "$RUNNER_TEMP/deb.log"
              exit "$code"
            fi
            tail -n 20 "$RUNNER_TEMP/deb.log"
            set +e
            npx tauri build --bundles appimage --config '{"bundle":{"externalBin":["binaries/traza-host"]}}' >"$RUNNER_TEMP/appimage.log" 2>&1
            code=$?
            set -e
            if [ "$code" -ne 0 ]; then
              report "AppImage" warning "$RUNNER_TEMP/appimage.log"
              echo "El .deb quedó listo. El AppImage no se generó."
            else
              tail -n 20 "$RUNNER_TEMP/appimage.log"
            fi
          else
            npx tauri build --config '{"bundle":{"externalBin":["binaries/traza-host"]}}'
            if [ "$(uname -s)" = "Darwin" ]; then
              sh scripts/macos_bundle.sh
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: traza-${{ matrix.triple }}
          path: |
            desktop/src-tauri/target/release/bundle/**
