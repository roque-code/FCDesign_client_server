[package]
name = "traza-desktop"
version = "0.2.0"
edition = "2021"
description = "Ventana de escritorio de Aulivana-FCDdesign"
rust-version = "1.77"

[lib]
name = "traza_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
# 0.21.3 añade campos a ParseOption y tauri-plugin-deep-link 2.6.2 deja de compilar en Linux.
# 0.21.2 está retirado del registro.
rust-ini = "=0.21.1"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
