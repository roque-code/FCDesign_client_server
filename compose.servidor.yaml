# Servidor HTTPS en fcdesign.aulivana.com. Django envía la confirmación a Gmail.
# No levanta Mailpit. Las claves se leen del .env de esta misma carpeta.
# El certificado tiene que existir en el host antes de levantar Nginx.
name: traza

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: traza
      POSTGRES_USER: traza
      POSTGRES_PASSWORD: traza
    volumes:
      - traza-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traza -d traza"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - web

  redis:
    image: redis:7-alpine
    command: ["redis-server", "/etc/traza/redis.conf"]
    volumes:
      - ./deploy/redis/redis.conf:/etc/traza/redis.conf:ro
      - ./deploy/redis/users.acl:/etc/traza/users.acl:ro
      - traza-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "web", "--pass", "traza-web-dev", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - web
      - isolated

  runner:
    build:
      context: .
      dockerfile: deploy/runner.Dockerfile
    environment:
      HOME: /tmp
      REDIS_URL: redis://runner:traza-runner-dev@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 64
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,redis; r=redis.Redis.from_url(os.environ['REDIS_URL'], decode_responses=True); raise SystemExit(0 if r.get('traza:hb') else 1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - isolated

  languages:
    build:
      context: .
      dockerfile: deploy/languages.Dockerfile
    environment:
      HOME: /tmp
      TRAZA_LANGUAGE_TOKEN: ${TRAZA_LANGUAGE_TOKEN:-traza-language-dev}
      TRAZA_LANGUAGE_BIND: 0.0.0.0
      TRAZA_LANGUAGE_PORT: "8766"
      TRAZA_RUNTIME_DIR: /opt/traza-runtimes
      TRAZA_RUNTIME_MANIFEST: /opt/traza/deploy/runtimes/manifest.json
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 640m
    cpus: 0.75
    pids_limit: 128
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request; t=os.environ['TRAZA_LANGUAGE_TOKEN']; urllib.request.urlopen('http://127.0.0.1:8766/local/v1/health?token=' + t)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 8s
    networks:
      - languages

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Falta DJANGO_SECRET_KEY en el .env de esta carpeta}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web,nginx,fcdesign.aulivana.com}
      DJANGO_CSRF_ORIGINS: ${DJANGO_CSRF_ORIGINS:-https://fcdesign.aulivana.com}
      TRAZA_RUNNER: redis
      TRAZA_LANGUAGE_HOST: "0"
      TRAZA_LANGUAGE_ORIGIN: http://languages:8766
      TRAZA_LANGUAGE_TOKEN: ${TRAZA_LANGUAGE_TOKEN:-traza-language-dev}
      REDIS_URL: redis://web:traza-web-dev@redis:6379/0
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: "587"
      EMAIL_HOST_USER: aulivana.fcdesign@gmail.com
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:?Falta EMAIL_HOST_PASSWORD en el .env de esta carpeta}
      EMAIL_USE_TLS: "1"
      DEFAULT_FROM_EMAIL: aulivana.fcdesign@gmail.com
      TRAZA_EMAIL_CONFIRMATION: "1"
      TRAZA_PUBLIC_ORIGIN: ${TRAZA_PUBLIC_ORIGIN:-https://fcdesign.aulivana.com}
      TRAZA_RUNTIME_MANIFEST: /opt/traza/deploy/runtimes/manifest.json
      TRAZA_RUNTIME_DIR: /var/lib/traza
      TRAZA_MAIL_UI: ""
      POSTGRES_DB: traza
      POSTGRES_USER: traza
      POSTGRES_PASSWORD: traza
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - .:/opt/traza
      - traza-runtimes:/var/lib/traza
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      runner:
        condition: service_healthy
      languages:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/auth/csrf/')",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 25s
    networks:
      - web
      - languages

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx.servidor.Dockerfile
    volumes:
      - ./deploy/nginx/servidor.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/runtimes:/usr/share/nginx/html/runtimes:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      web:
        condition: service_healthy
    networks:
      - web

networks:
  web:
  isolated:
    internal: true
  languages:
    internal: true

volumes:
  traza-db:
  traza-redis:
  traza-runtimes:
